# プロジェクト要件：アイデア管理ツール（IdeaPost）

## 概要

思いついたアイデアを「カード（メモ）」として記録し、「ブック」にドラッグ＆ドロップで整理するWebアプリをLaravelで実装する。

シンプルさを重視し、軽量で直感的に使える構成とする。

---

## 技術要件

* バックエンド：Laravel
* フロント：Bladeテンプレート + 軽量JavaScript（Reactは使用しない）
* ドラッグ＆ドロップ：SortableJS
* PDF出力：dompdf
* Markdown変換：league/commonmark

---

## 機能要件

### 1. メモ管理

* メモは「本文のみ」（タイトルなし）
* Markdown形式で保存
* 作成 / 編集 / 削除（論理削除）
* 自動保存（または簡易保存）

### 2. ブック管理

* ブック作成 / 編集 / 削除
* メモをブックに所属させる
* 未分類（book_id = NULL）あり

### 3. ドラッグ＆ドロップ

* メモの移動

  * 未分類 ⇄ ブック
  * ブック間移動
* 並び替え対応
* ドロップ時のみAPIで保存

---

## 並び順仕様（重要）

* sort_order は間隔を持つ数値で管理（例：100, 200, 300）
* 挿入時は中間値を使用（例：150）
* 全件更新は禁止（差分更新のみ）

---

## 削除仕様

* 論理削除方式
* status: active / archived / deleted
* deleted_at を保持
* 復元可能

---

## データ構造

### Books

* id
* title
* description
* timestamps

### Notes

* id
* public_id
* book_id（NULL可）
* content（Markdown）
* sort_order
* status
* deleted_at
* timestamps

---

## UI構成

### 3カラムレイアウト

1. ブック一覧（サイドバー）
2. メモ一覧（カード表示 + D&D対応）
3. 編集エリア（Markdown入力 + プレビュー）

---

## API設計（最低限）

* POST /notes
* PUT /notes/{id}
* POST /notes/move（D&D用）
* DELETE /notes/{id}

---

## PDF出力

* ブック単位で出力
* 並び順を反映
* Markdown → HTML → PDF変換
* シンプルレイアウト（複雑なCSSは禁止）

---

## 非機能要件

* D&Dは非同期処理
* 操作レスポンス重視（ローディング最小）
* シンプルなUIを維持

---

## 制約・方針

* Reactなどの重いフロントフレームワークは使用しない
* シンプル実装を優先
* 拡張性よりスピードと軽さ重視

---

## 実装上の注意

* ドラッグ中にAPIを呼ばない（onEndのみ）
* sort_orderは必ず差分更新
* PDFは最低限の見た目でよい（品質より安定性）
* Markdownは保存時ではなく表示時に変換

---

## ゴール

* アイデアを素早く記録できる
* ドラッグ＆ドロップで整理できる
* PDFとして出力できる

シンプルでストレスのない「思考整理ツール」を目指す
